services:
  naviod:
    restart: unless-stopped
    container_name: btcpayserver_naviod
    image: navio/naviod:latest
    environment:
      NAVIO_NETWORK: ${NBITCOIN_NETWORK:-testnet}
      NAVIO_EXTRA_ARGS: |
        rpcport=33677
        rpcbind=0.0.0.0:33677
        rpcallowip=0.0.0.0/0
        port=33670
        whitelist=0.0.0.0/0
    expose:
      - "33677"
      - "33670"
    volumes:
      - "navio_datadir:/data"
      - "navio_wallet_datadir:/walletdata"
      # libblsct.so shared volume: naviod entrypoint must copy
      # /usr/local/lib/libblsct.so to /opt/libblsct/ on startup
      - "navio_libblsct:/opt/libblsct"
  nbxplorer:
    environment:
      NBXPLORER_CHAINS: "nav"
      NBXPLORER_NAVRPCURL: http://naviod:33677/
      NBXPLORER_NAVNODEENDPOINT: naviod:33670
      # Native P/Invoke needs libblsct.so for BLSCT address derivation
      LD_LIBRARY_PATH: "/opt/libblsct"
    depends_on:
      - naviod
    volumes:
      - "navio_datadir:/root/.navio"
      - "navio_libblsct:/opt/libblsct:ro"
  btcpayserver:
    environment:
      BTCPAY_CHAINS: "nav"
      BTCPAY_NAVEXPLORERURL: http://nbxplorer:24445/
volumes:
  navio_datadir:
  navio_wallet_datadir:
  navio_libblsct:
required:
  - "nbxplorer"